server:
  port: 8081

spring:
  application:
    name: JR701-Admin-Api

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/jrtp701_ish_db?useSSL=false&serverTimezone=UTC
    username: root
    password: Pspk#@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  boot:
    admin:
      client:
        url: http://localhost:9090

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true   # ✅ IMPORTANT

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.discovery: DEBUG
